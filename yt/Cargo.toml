[package]
name = "yt"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["multipart", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
