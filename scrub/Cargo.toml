[package]
name = "scrub"
version = "0.1.0"
edition = "2021"

[dependencies]
specs = { path = "../specs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", features = ["json", "gzip", "brotli", "rustls-tls"] }
scraper = "0.14"
anyhow = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
