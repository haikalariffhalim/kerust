[package]
name = "comp"
description: "An image compressor tool to resize and convert to appropriate format before upload to bucket"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.24"
imageproc = "0.23"
palette = "0.6"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
zstd = "0.11"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
