on:
  schedule:
    - cron: "0 0 * * 0" # every Sunday

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build cleaner
        run: cargo build -p s3_cleaner --release

      - name: Run cleaner
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ./target/release/s3_cleaner --bucket "${{ secrets.S3_BUCKET }}" --prefix tmp/ --older-than-days 30
